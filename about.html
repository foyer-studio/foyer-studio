      <h2>Why Foyer Studio exists</h2>
      <p>I started Foyer Studio because most listing photography around here felt like an afterthought. Properties shot quickly, delivered slowly, edited with a look that serves no one — not the agent, not the buyer, not the home itself.</p>
      <p>The name comes from the foyer — the first room a buyer walks into. That moment at the threshold, before a word is spoken, when an impression is already formed. I photograph every property with that moment in mind.</p>
      <p>Every booking is mine. There are no associate photographers, no outsourced editing, no templated workflows. When you work with Foyer Studio, you’re working with me.</p>

      <h2>The approach</h2>
      <p>I spend a few minutes walking the property before I shoot anything. That walkthrough tells me how light moves through the space, which rooms need more time, and how to frame each shot so it reads naturally — not staged, not overcorrected.</p>
      <p>Post-processing is calibrated to accuracy, not saturation. The goal is a photograph that shows a buyer exactly what they’ll see when they walk in — nothing enhanced beyond what’s real.</p>

      <h2>The commitment</h2>
      <p>Next-day delivery isn’t a selling point — it’s just how I work. Every gallery lands in your inbox by 9 AM the morning after the shoot, regardless of package. Same-day is available when you need it.</p>
      <p>The same photographer shows up every time. If I’m unavailable, I’ll tell you upfront and we’ll find a time that works — the booking doesn’t get handed off.</p>

      <blockquote class="about-quote">
        “The work is only as good as the attention it receives. I don’t scale by hiring. I scale by being selective.”
      </blockquote>
